<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Number Line Flash Cards</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Inter:wght@400;600;700;800&display=swap">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: Inter, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: #0f1729; color: #f7f3ec; margin: 0; padding: 0 16px;
    display: flex; flex-direction: column;
  }
  h1, .wm, .q, .ans { font-family: "Atkinson Hyperlegible", Inter, Arial, sans-serif; }
  button, .card { touch-action: manipulation; -webkit-user-select: none; user-select: none; }
  .top { padding: 12px 2px 0; }
  .lockup { display: flex; align-items: center; gap: 8px; }
  .lockup svg { width: 30px; height: 30px; border-radius: 8px; flex: none; }
  .wm { font-weight: 700; font-size: 17px; }
  .desc { font-size: 10.5px; letter-spacing: 3px; color: #f5b942; font-weight: 700; margin-top: 3px; }
  h1 { font-size: clamp(19px, 2.6vw, 26px); margin: 8px 0 2px; }
  .sub { color: rgba(247,243,236,.7); font-size: clamp(13px, 1.8vw, 17px); margin: 0 0 6px; }
  .counts { font-size: clamp(14px, 2vw, 19px); margin: 4px 0 8px; color: rgba(247,243,236,.85); }
  .counts b { color: #4cc98f; } .counts .left { color: #f5b942; font-weight: 700; }
  .stage {
    width: 100%; max-width: 780px; margin: 0 auto;
    flex: 1; display: flex; flex-direction: column; justify-content: center; padding-bottom: 14px;
  }
  .card { position: relative; width: 100%; flex: 1; min-height: 360px; max-height: 680px; cursor: pointer; }
  .face {
    height: 100%; border-radius: 24px; padding: clamp(18px, 3vw, 36px);
    display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
    gap: clamp(10px, 1.6vh, 18px); overflow-y: auto; animation: pop .18s ease-out;
  }
  @keyframes pop { from { transform: scale(.97); opacity: .5; } to { transform: scale(1); opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .face { animation: none; } }
  .card .back { display: none; }
  .card.flipped .front { display: none; }
  .card.flipped .back { display: flex; }
  .front { background: #161f3a; border: 3px solid #2a3558; }
  .front.rulecard { border-color: #f5b942; }
  .back { background: #f7f3ec; color: #1e2233; border: 3px solid #f5b942; }
  .meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: center; }
  .idea { background: #f5b942; color: #0f1729; font-weight: 800; font-size: clamp(12px, 1.6vw, 15px); letter-spacing: 1.5px; border-radius: 999px; padding: 5px 14px; }
  .src { font-size: clamp(12px, 1.5vw, 14px); color: rgba(247,243,236,.55); }
  .q { font-size: clamp(26px, 4.4vw, 44px); font-weight: 700; line-height: 1.25; text-wrap: balance; }
  .q.big { font-size: clamp(38px, 7vw, 68px); white-space: nowrap; }
  .big-inline { font-size: 1.35em; }
  .qbox { display: inline-block; min-width: 1.2em; border: 3px dashed #f5b942; border-radius: 12px; color: #f5b942; padding: 0 .12em; }
  .choices { font-size: clamp(17px, 2.4vw, 24px); color: rgba(247,243,236,.75); font-weight: 600; }
  .items { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
  .chip { display: inline-flex; align-items: center; font-family: "Atkinson Hyperlegible", Inter, sans-serif; font-weight: 700;
          font-size: clamp(22px, 3.4vw, 34px); background: #232f52; border: 2px solid #39466f; border-radius: 12px; padding: 6px 14px; }
  .tapnote { font-size: clamp(13px, 1.7vw, 16px); color: rgba(247,243,236,.55); }
  .ans { font-size: clamp(28px, 5vw, 52px); font-weight: 700; line-height: 1.2; text-wrap: balance; }
  .sym { color: #2e7d52; font-size: 1.15em; }
  .ordered { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; justify-content: center; }
  .chip.ok { background: #e6f4ec; border-color: #2e7d52; color: #1e2233; font-size: clamp(19px, 3vw, 30px); padding: 4px 10px; }
  .arrow { color: #2e7d52; font-weight: 800; font-size: clamp(18px, 2.6vw, 26px); }
  .how { font-size: clamp(17px, 2.4vw, 23px); line-height: 1.4; color: #3b3529; }
  .tip { font-size: clamp(15px, 2.1vw, 20px); line-height: 1.4; color: #7a5a00; background: #fbefd2; border-radius: 12px; padding: 8px 14px; font-weight: 600; }
  #b-nl, #b-how, #b-tip { width: 100%; }
  #b-nl { display: flex; justify-content: center; }
  #b-how { display: flex; flex-direction: column; gap: 4px; }
  svg.nl { width: 100%; max-width: 640px; height: auto; flex: none; }
  .fx { white-space: nowrap; }
  .whole { margin-right: .08em; }
  .fr { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; font-size: .72em; line-height: 1.05; margin: 0 .06em; }
  .fr .den { border-top: .09em solid currentColor; }
  .row { display: flex; gap: 12px; margin-top: 16px; }
  .btn { font: inherit; font-size: clamp(18px, 2.5vw, 24px); font-weight: 800; cursor: pointer; border: none; border-radius: 16px; padding: 18px 10px; color: #fff; flex: 1; min-height: 62px; }
  .again { background: #c75a38; box-shadow: 0 4px 0 #8f3517; }
  .got { background: #2fa36b; box-shadow: 0 4px 0 #1d6b45; }
  .win { display: none; text-align: center; padding: 40px 16px; }
  .win .emoji { font-size: 72px; }
  .win h2 { font-family: "Atkinson Hyperlegible", Inter, sans-serif; color: #f5b942; font-size: 28px; }
  .win p { font-size: 18px; }
  .winrow { display: flex; flex-direction: column; gap: 12px; align-items: center; }
  .resetbtn { font: inherit; font-weight: 800; font-size: 17px; cursor: pointer; border: none; border-radius: 14px; padding: 15px 26px; min-width: 240px; }
  .mix { background: #f5b942; color: #0f1729; }
  .inorder { background: #232f52; color: #f7f3ec; border: 2px solid #39466f; }
</style>
</head>
<body>

<div class="top">
  <div class="lockup"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640">
  <rect width="640" height="640" rx="120" fill="#0F1729"/>
  <g transform="translate(60,190) scale(0.494)">
    <path fill="#F7F3EC" d="M915.61,342.15c-35.13,30.74-89.5,22.29-113.65-17.66L611.96,11.58c-4.36-7.19-12.17-11.58-20.59-11.58h-237.26l207.62,341.94-.24.21c-35.13,30.74-89.5,22.29-113.65-17.66L257.85,11.58c-4.36-7.19-12.17-11.58-20.59-11.58H0l346.93,571.37c19.95,32.86,67.83,32.34,87.05-.96l64.26-111.29,65.88-113.26,136.93,225.51c19.95,32.86,67.83,32.34,87.05-.96l64.26-111.29,72.99-125.48-9.73,8.51Z"/>
    <path fill="#F5B942" d="M780,28 C850,2 895,12 912,46 C929,12 974,2 1044,28 L1044,196 C980,176 938,184 912,214 C886,184 844,176 780,196 Z"/>
    <path stroke="#0F1729" stroke-width="16" fill="none" d="M912,52 L912,208"/>
  </g>
</svg><span class="wm">wasiendo</span><span class="desc">ACADEMY</span></div>
  <h1>Number Line Flash Cards</h1>
  <p class="sub">Tap the card to flip · 5 big ideas · gold cards are the big ideas</p>
</div>

<div class="counts"><span class="left" id="left"></span> in the deck · <b id="done">0</b> mastered</div>

<div class="stage" id="stage">
  <div class="card" id="card">
    <div class="face front" id="front">
      <div class="meta"><span class="idea" id="f-idea"></span><span class="src" id="f-src"></span></div>
      <div id="f-body"></div>
      <div class="tapnote">tap to flip ↻</div>
    </div>
    <div class="face back">
      <div class="ans" id="b-ans"></div>
      <div id="b-how"></div>
      <div id="b-nl"></div>
      <div id="b-tip"></div>
    </div>
  </div>
  <div class="row">
    <button class="btn again" id="againbtn" type="button">🔁 AGAIN</button>
    <button class="btn got" id="gotbtn" type="button">✓ GOT IT</button>
  </div>
</div>

<div class="win" id="win">
  <div class="emoji">🏆</div>
  <h2>All 23 mastered!</h2>
  <p>Now mix them up. Test questions come in any order.</p>
  <div class="winrow">
    <button class="resetbtn mix" id="mixbtn" type="button">🔀 Play again, mixed up</button>
    <button class="resetbtn inorder" id="resetbtn" type="button">Start over in order</button>
  </div>
</div>

g>"}];
let deck = CARDS.map((_, i) => i);
let mastered = 0;
const card = document.getElementById('card');
function render() {
  document.getElementById('left').textContent = deck.length;
  document.getElementById('done').textContent = mastered;
  if (deck.length === 0) {
    document.getElementById('stage').style.display = 'none';
    document.getElementById('win').style.display = 'block';
    return;
  }
  document.getElementById('stage').style.display = 'flex';
  document.getElementById('win').style.display = 'none';
  const c = CARDS[deck[0]];
  card.classList.remove('flipped');
  document.getElementById('front').classList.toggle('rulecard', c.rule);
  document.getElementById('f-idea').textContent = (c.rule ? '★ ' : '') + c.idea;
  document.getElementById('f-src').textContent = c.src;
  document.getElementById('f-body').innerHTML = c.front;
  document.getElementById('b-ans').innerHTML = c.ans;
  document.getElementById('b-how').innerHTML = c.how;
  document.getElementById('b-nl').innerHTML = c.nl;
  document.getElementById('b-tip').innerHTML = c.tip;
}
card.addEventListener('click', () => card.classList.toggle('flipped'));
document.getElementById('againbtn').addEventListener('click', () => { deck.push(deck.shift()); render(); });
document.getElementById('gotbtn').addEventListener('click', () => { deck.shift(); mastered++; render(); });
document.getElementById('resetbtn').addEventListener('click', () => { deck = CARDS.map((_, i) => i); mastered = 0; render(); });
document.getElementById('mixbtn').addEventListener('click', () => {
  deck = CARDS.map((_, i) => i);
  for (let i = deck.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [deck[i], deck[j]] = [deck[j], deck[i]]; }
  mastered = 0; render();
});
render();
</script>
